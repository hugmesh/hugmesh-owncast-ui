<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HugMesh Owncast (remote)</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HugMesh Owncast console — stream self-service, broadcast grants and moderation." />
  <meta name="theme-color" content="#0a0a12" />
  <!-- Relative href on purpose: the remote may be served under a path prefix,
       and the assets glob ships src/assets verbatim. Canonical HugMesh
       favicon (copied from the hugmesh.net host). -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Runtime theme (fleet 50-hug-theme.sh mechanism): RELATIVE href so it
       resolves under this app's mount behind the gateway; the file's
       :root:root block out-specifies the compiled :root fallbacks regardless
       of stylesheet order. Empty when unthemed (zero-byte 200, no 404). -->
  <link rel="stylesheet" href="hug-theme.css">
</head>
<body>
  <hug-owncast-root></hug-owncast-root>
</body>
</html>
