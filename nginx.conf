# Per-response CSP nonce source. nginx has no built-in random generator, so we
# reuse $request_id (a unique 32-hex-char token nginx mints for EVERY request):
# unguessable and different on every response, i.e. a sound nonce. The `map`
# exposes it as $cspnonce, which is injected into BOTH the script-src directive
# AND every <script> tag of index.html (sub_filter below) so the two can never
# disagree.
#
# Scope: this file is COPIED TO /etc/nginx/conf.d/default.conf (see Dockerfile),
# and the stock nginx.conf of nginxinc/nginx-unprivileged does
# `include /etc/nginx/conf.d/*.conf;` INSIDE its http block — so a bare `map`
# (http-scope-only directive) at the top of this file is legal here. If this
# file is ever promoted to a whole-file /etc/nginx/nginx.conf replacement, the
# map + server would have to be wrapped in an explicit `http { }`.
map $request_id $cspnonce {
    default $request_id;
}

server {
    # :8080 to match the federation-api owncast module registration
    # remote_entry_url = http://hugmesh-owncast-ui:8080/remoteEntry.json.
    # nginx-unprivileged listens on 8080 by default (non-root).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes: none of
    # these block same-origin scripts or cross-origin script-based federation.
    # (This remote's own auth is entirely HttpOnly bff_-cookie based — there is
    # no browser-facing OAuth redirect flow to accommodate; Casdoor is
    # internal-only under the native-login model.) Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection (the SPA is never framed;
    #     module federation loads remotes via <script>, not iframes, so this is safe).
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # ── Content-Security-Policy (nonce-based XSS backstop) ────────────────────
    # WHY THIS EXISTS AT ALL: the gateway emits a blanket fallback CSP
    # (`script-src 'self'`) for any upstream that sends none. Angular
    # native-federation's index.html carries an INLINE `<script
    # type="esms-options">` block and loads the app with `type="module-shim"`;
    # under a nonce-less `script-src 'self'` that inline block is BLOCKED,
    # es-module-shims is never configured, the app bundle never executes and the
    # page renders BLANK with no server error. Serving our OWN nonce'd CSP here
    # wins over the gateway fallback and keeps the bootstrap running.
    #
    # There is NO 'unsafe-inline' / 'unsafe-hashes' in script-src — only the
    # per-response nonce (and 'unsafe-inline' would be IGNORED by browsers
    # anyway whenever a nonce is present). Directive-by-directive, tuned to what
    # THIS console actually does (an Owncast governance console with ONE
    # embedded HLS preview player — no wasm, no iframes, no sockets):
    #   - default-src 'self'                        : same-origin default for
    #                                                  anything not named below.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only the nonce'd bootstrap
    #                                                  scripts we shipped run;
    #                                                  es-module-shims (2.8.1)
    #                                                  auto-propagates the nonce
    #                                                  to the ES modules it
    #                                                  injects, and blob: covers
    #                                                  the shim/worker-created
    #                                                  module scripts. NO
    #                                                  'wasm-unsafe-eval': this
    #                                                  UI ships no WebAssembly
    #                                                  (no .wasm asset, no
    #                                                  WebAssembly reference in
    #                                                  src/**).
    #   - style-src 'self' 'unsafe-inline'          : Angular injects component
    #                                                  styles as runtime <style>
    #                                                  elements, which cannot be
    #                                                  nonce'd, so
    #                                                  'unsafe-inline' is
    #                                                  REQUIRED. No blob: —
    #                                                  nothing here builds
    #                                                  stylesheets from blobs.
    #   - img-src 'self' data:                      : the only image shipped is
    #                                                  the same-origin
    #                                                  assets/favicon.ico; data:
    #                                                  covers assets esbuild may
    #                                                  inline. NO remote https:
    #                                                  images — this console
    #                                                  renders none.
    #   - font-src 'self'                           : styles/_tokens.scss uses
    #                                                  SYSTEM font stacks only
    #                                                  (Arial / ui-monospace) —
    #                                                  there is no @font-face and
    #                                                  no webfont asset.
    #   - media-src 'self' https: blob:             : THE LIVE-VIDEO DIRECTIVE.
    #                                                  owncast-stream.component
    #                                                  renders a real <video>
    #                                                  HLS preview bound to the
    #                                                  bff's typed playbackUrl.
    #                                                  That URL comes from the
    #                                                  bff's
    #                                                  OWNCAST_PLAYBACK_URL_TEMPLATE
    #                                                  (OwncastPlaybackUrlResolver),
    #                                                  which is env-configured at
    #                                                  deploy time and points at
    #                                                  the per-streamer Owncast
    #                                                  instance — same-origin via
    #                                                  the fe-gateway
    #                                                  (/owncast/{subject}/hls/…)
    #                                                  OR an absolute https://
    #                                                  origin, unknowable here —
    #                                                  hence 'self' + https:.
    #                                                  blob: is for the hls.js
    #                                                  path (attachMedia sets
    #                                                  video.src to a MediaSource
    #                                                  blob: object URL). Without
    #                                                  an explicit media-src the
    #                                                  default-src 'self'
    #                                                  fallback blocks both.
    #   - connect-src 'self' https: blob:           : the BFF is same-origin
    #                                                  (/bff/owncast/**) but the
    #                                                  host can repoint it at an
    #                                                  absolute origin via
    #                                                  __HUG_OWNCAST_URL__
    #                                                  (OWNCAST_BASE_URL token),
    #                                                  and hls.js XHRs the HLS
    #                                                  manifest + segments from
    #                                                  the same env-configured
    #                                                  playback origin — neither
    #                                                  is enumerable at build
    #                                                  time, so https: is
    #                                                  deliberately broad. blob:
    #                                                  covers shim/worker
    #                                                  same-origin blob fetches
    #                                                  (no wider than https:).
    #                                                  NO wss: — this UI opens no
    #                                                  WebSocket and no
    #                                                  EventSource (grep-verified
    #                                                  across src/**); Owncast's
    #                                                  own chat socket lives in
    #                                                  the Owncast web app, not
    #                                                  in this console.
    #   - worker-src 'self' blob:                   : es-module-shims and hls.js
    #                                                  both spin up workers from
    #                                                  blob: URLs (hls.js's
    #                                                  transmuxer). The app
    #                                                  itself constructs no
    #                                                  Worker and registers no
    #                                                  service worker.
    #   - frame-src 'none'                          : this console embeds NO
    #                                                  iframe (grep-verified) —
    #                                                  tighter than letting it
    #                                                  fall back to default-src
    #                                                  'self'.
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : deny all framing OF this
    #                                                  app (mirrors X-Frame-
    #                                                  Options DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header Access-Control-Allow-Origin "*" always;

        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has MULTIPLE script tags (the
        #                           inline `type="esms-options"` block, the
        #                           es-module-shims polyfill and the
        #                           `type="module-shim"` app bootstrap) — rewrite
        #                           ALL of them, not just the first.
        #   - sub_filter_types text/html : ONLY rewrite the HTML document; the JS
        #                           bundles (which can legitimately contain the
        #                           literal string "<script") stay byte-for-byte
        #                           untouched.
        # NB: do NOT enable gzip_static / precompressed index.html — sub_filter
        # cannot rewrite an already-compressed response body, which would leave
        # the <script> tags un-nonced and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data:; font-src 'self'; media-src 'self' https: blob:; connect-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Re-emit the server-scope security headers: nginx's add_header
        # inheritance drops ALL inherited add_headers in any location that sets
        # its own (this one sets Access-Control-Allow-Origin + CSP), so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        # Re-emit the server-scope security headers: this location sets its own
        # add_header (Content-Type), which makes nginx drop the inherited ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
